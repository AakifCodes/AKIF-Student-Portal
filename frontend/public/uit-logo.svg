<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#1b4d89" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Logo Circle Emblem -->
  <g transform="translate(42, 40)">
    <!-- Outer Ring -->
    <circle r="36" fill="none" stroke="#1d4e89" stroke-width="3" />
    <circle r="32" fill="#ffffff" stroke="#1d4e89" stroke-width="1.5" stroke-dasharray="1 2" />
    
    <!-- Central Disc -->
    <circle r="27" fill="#1d4e89" filter="url(#shadow)" />
    
    <!-- Stylized 'U' and 'i' and 't' -->
    <!-- Dot of the 'i' -->
    <circle cx="0" cy="-14" r="3.2" fill="#ffffff" />
    <!-- Center 'i' stem -->
    <path d="M-2.2 -8 L2.2 -8 L2.2 12 L-2.2 12 Z" fill="#ffffff" />
    <!-- Outer 'U' cradle around 'i' -->
    <path d="M-15 -6 C-15 14, 15 14, 15 -6" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round" />
    <!-- T horizontal crossbar -->
    <path d="M-8 -3 L8 -3" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    
    <!-- Micro Urdu / Arabic Calligraphy arc at bottom of ring -->
    <path id="curveBottom" d="M -24,4 A 24,24 0 0,0 24,4" fill="none" />
    <text font-family="'Segoe UI', Tahoma, Arial, sans-serif" font-size="4.5" fill="#ffffff" text-anchor="middle" font-weight="600">
      <textPath href="#curveBottom" startOffset="50%">UIT UNIVERSITY</textPath>
    </text>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(90, 48)">
    <text font-family="'Outfit', 'Montserrat', 'Segoe UI', sans-serif" font-weight="800" font-size="34" fill="#1d4e89" letter-spacing="1">UIT</text>
    <text x="2" y="16" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="12" fill="#1d4e89" letter-spacing="3.5">UNIVERSITY</text>
  </g>
</svg>
